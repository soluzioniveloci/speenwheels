<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Ruota della Fortuna Nativa 🎰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Stili personalizzati per la barra di scorrimento dei numeri eliminati */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(212, 163, 89, 0.5);
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-amber-900 to-black flex flex-col items-center justify-center p-4 relative overflow-hidden font-sans">
    
    <div class="absolute inset-0 opacity-20 pointer-events-none">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-yellow-500 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-red-600 rounded-full blur-3xl animate-pulse" style="animation-delay: 1s;"></div>
    </div>
    
    <canvas id="confettiCanvas" class="absolute inset-0 pointer-events-none z-50"></canvas>
    
    <div class="relative z-10 w-full max-w-7xl">
        <div class="text-center mb-6">
            <h1 class="text-5xl md:text-7xl font-bold mb-3 text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-amber-400 to-red-500 drop-shadow-2xl">
                🎰 RUOTA DELLA FORTUNA 🎰
            </h1>
            <div class="flex justify-center gap-3 mt-6">
                <div class="w-4 h-4 bg-yellow-400 rounded-full animate-bounce"></div>
                <div class="w-4 h-4 bg-red-600 rounded-full animate-bounce" style="animation-delay: 0.1s;"></div>
                <div class="w-4 h-4 bg-yellow-400 rounded-full animate-bounce" style="animation-delay: 0.2s;"></div>
            </div>
        </div>
        
        <div id="setupScreen" class="max-w-xl mx-auto bg-gradient-to-br from-amber-900/90 to-red-900/90 backdrop-blur-xl p-12 rounded-3xl border-4 border-yellow-400 shadow-2xl">
            <h2 class="text-4xl text-yellow-300 mb-6 font-bold text-center drop-shadow-lg">🎯 Inserisci il Numero Vincente</h2>
            <p class="text-gray-100 mb-8 text-center text-xl">Questo numero uscirà per ultimo!</p>
            <input
              type="number" id="secretInput" min="1" max="20"
              class="w-full px-8 py-6 text-4xl text-center bg-black/80 text-yellow-300 border-4 border-yellow-400 rounded-2xl mb-8 font-bold focus:ring-4 focus:ring-yellow-300 focus:outline-none shadow-2xl"
              placeholder="1-20"
            />
            <button
              id="startBtn"
              class="w-full bg-gradient-to-r from-yellow-400 via-amber-500 to-red-600 text-white px-10 py-6 rounded-2xl font-bold text-3xl hover:from-yellow-500 hover:to-red-700 transition-all shadow-2xl hover:scale-105 border-2 border-yellow-300"
            >
              🎮 INIZIA IL GIOCO
            </button>
        </div>
        
        <div id="gameScreen" class="hidden flex flex-col lg:flex-row justify-center items-center lg:items-start gap-10">
            
            <div class="flex flex-col items-center">
                <div class="relative mb-6 p-6 md:p-10 bg-gradient-to-br from-amber-950/60 to-red-950/60 rounded-3xl shadow-2xl border-4 border-yellow-500 backdrop-blur-sm">
                    <canvas id="wheelCanvas" width="700" height="700" class="drop-shadow-2xl max-w-full h-auto"></canvas>
                </div>
                
                <div id="resultBanner" class="hidden bg-gradient-to-r from-yellow-400 via-amber-500 to-red-600 px-16 py-8 rounded-3xl mb-8 shadow-2xl border-4 border-yellow-200">
                    <p id="resultText" class="text-3xl md:text-5xl font-bold text-white drop-shadow-2xl text-center"></p>
                </div>
                
                <div id="controlsPanel" class="flex flex-col items-center gap-6">
                    <button
                      id="shuffleBtn"
                      class="bg-gradient-to-r from-blue-500 via-purple-600 to-indigo-700 text-white px-12 py-5 rounded-3xl font-bold text-2xl md:text-3xl transition-all shadow-2xl border-4 border-blue-300 hover:from-blue-600 hover:to-indigo-800 hover:scale-105"
                    >
                      🔀 MISCHIA NUMERI
                    </button>
                    <button
                      id="spinBtn"
                      class="bg-gradient-to-r from-yellow-400 via-amber-500 to-red-600 text-white px-20 py-7 rounded-3xl font-bold text-3xl md:text-4xl transition-all shadow-2xl border-4 border-yellow-200 hover:from-yellow-500 hover:to-red-700 hover:scale-110 animate-pulse"
                    >
                      🎰 GIRA LA RUOTA
                    </button>
                </div>
                
                <div id="gameOverPanel" class="hidden bg-gradient-to-r from-yellow-300 via-amber-400 to-red-500 p-12 rounded-3xl border-4 border-yellow-200 shadow-2xl text-center animate-pulse">
                    <h2 class="text-5xl md:text-6xl font-bold text-white mb-6 drop-shadow-2xl">🏆 GIOCO TERMINATO! 🏆</h2>
                    <p id="gameOverText" class="text-3xl text-white drop-shadow-xl"></p>
                </div>
            </div>
            
            <div class="w-full max-w-md lg:w-96 lg:mt-10">
                <div class="bg-gradient-to-br from-black/80 to-amber-950/80 backdrop-blur-md p-6 rounded-3xl border-4 border-yellow-500 shadow-2xl sticky top-10">
                    <h3 id="remCount" class="text-2xl md:text-3xl text-yellow-300 mb-3 font-bold">📊 Numeri Rimasti: 20</h3>
                    <h3 id="elimCount" class="text-2xl md:text-3xl text-red-400 mb-6 font-bold">❌ Numeri Eliminati: 0</h3>
                    <div id="eliminatedContainer" class="flex flex-wrap gap-3 justify-start max-h-[50vh] lg:max-h-[70vh] overflow-y-auto pr-2 custom-scrollbar">
                        </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Stato del Gioco
        let secretNumber = null;
        let numbers = [];
        let eliminatedNumbers = [];
        let spinning = false;
        let rotation = 0;
        let currentNumber = null;
        let gameOver = false;
        let confettiAnimationId = null;

        // Riferimenti DOM
        const setupScreen = document.getElementById('setupScreen');
        const gameScreen = document.getElementById('gameScreen');
        const secretInput = document.getElementById('secretInput');
        const startBtn = document.getElementById('startBtn');
        const wheelCanvas = document.getElementById('wheelCanvas');
        const confettiCanvas = document.getElementById('confettiCanvas');
        const resultBanner = document.getElementById('resultBanner');
        const resultText = document.getElementById('resultText');
        const controlsPanel = document.getElementById('controlsPanel');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const spinBtn = document.getElementById('spinBtn');
        const gameOverPanel = document.getElementById('gameOverPanel');
        const gameOverText = document.getElementById('gameOverText');
        const remCount = document.getElementById('remCount');
        const elimCount = document.getElementById('elimCount');
        const eliminatedContainer = document.getElementById('eliminatedContainer');

        // Configurazione Canvas Coriandoli
        const confettiCtx = confettiCanvas.getContext('2d');
        function resizeConfettiCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfettiCanvas);
        resizeConfettiCanvas();

        // Listener Iniziale
        startBtn.addEventListener('click', () => {
            const val = parseInt(secretInput.value);
            if (!val || val < 1 || val > 20) {
                alert('Inserisci un numero valido compreso tra 1 e 20');
                return;
            }
            secretNumber = val;
            
            // Genera lista da 1 a 20 ordinata
            numbers = Array.from({ length: 20 }, (_, i) => i + 1);
            
            // Passaggio schermata
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            updateStats();
            drawWheel();
        });

        // Mischia Numeri
        shuffleBtn.addEventListener('click', () => {
            if (spinning || currentNumber !== null || gameOver) return;
            
            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }
            drawWheel();
        });

        // Avvio Giro Ruota
        spinBtn.addEventListener('click', () => {
            if (spinning || numbers.length === 0 || currentNumber !== null || gameOver) return;
            
            spinning = true;
            disableButtons(true);
            
            let targetNum;
            if (numbers.length === 1) {
                targetNum = numbers[0];
                gameOver = true;
            } else {
                // Filtra escludendo il numero vincente deciso all'inizio
                const available = numbers.filter(n => n !== secretNumber);
                targetNum = available[Math.floor(Math.random() * available.length)];
            }
            
            const targetIndex = numbers.indexOf(targetNum);
            
            // Calcolo dell'angolo di arresto perfetto puntato sulla freccia (destra, 0 radianti)
            const anglePerSegment = 360 / numbers.length;
            const segmentStartAngle = targetIndex * anglePerSegment;
            const segmentCenterAngle = segmentStartAngle + (anglePerSegment / 2);
            
            let requiredRotation = 360 - segmentCenterAngle;
            requiredRotation = ((requiredRotation % 360) + 360) % 360;
            
            const totalSpins = 5;
            const targetAngleAnimation = (totalSpins * 360) + requiredRotation;
            const finalRotationAngle = requiredRotation;
            
            let startTimestamp = null;
            const duration = 3000;
            
            function animateWheel(timestamp) {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = (timestamp - startTimestamp) / duration;
                
                if (progress < 1) {
                    const easeOut = 1 - Math.pow(1 - progress, 4); // Effetto frenata fluida
                    rotation = targetAngleAnimation * easeOut;
                    drawWheel();
                    requestAnimationFrame(animateWheel);
                } else {
                    // Stop Ruota e Allineamento
                    rotation = finalRotationAngle;
                    currentNumber = targetNum;
                    
                    // Rimuovi dalle liste e metti negli eliminati
                    numbers = numbers.filter(n => n !== targetNum);
                    eliminatedNumbers.push(targetNum);
                    
                    // Mostra banner dell'estratto e spara coriandoli
                    resultText.innerText = `🎉 ULTIMO ESTRATTO: ${currentNumber} 🎉`;
                    resultBanner.classList.remove('hidden');
                    startConfetti();
                    
                    updateStats();
                    drawWheel();
                    
                    // Gestione del Post-Estrazione
                    setTimeout(() => {
                        currentNumber = null;
                        rotation = 0;
                        resultBanner.classList.add('hidden');
                        stopConfetti();
                        
                        if (gameOver) {
                            controlsPanel.classList.add('hidden');
                            gameOverText.innerHTML = `Il numero vincente rimasto per ultimo è il: <br><span class="text-6xl font-black text-yellow-300">${numbers[0]}</span>`;
                            gameOverPanel.classList.remove('hidden');
                            startConfetti(); // Coriandoli infiniti alla vittoria finale
                        } else {
                            spinning = false;
                            disableButtons(false);
                        }
                        drawWheel();
                    }, 2500);
                }
            }
            requestAnimationFrame(animateWheel);
        });

        // Disabilita/Abilita Interfaccia
        function disableButtons(status) {
            shuffleBtn.disabled = status;
            spinBtn.disabled = status;
            if(status) {
                shuffleBtn.classList.add('opacity-50', 'cursor-not-allowed');
                spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
                spinBtn.innerText = '🎡 GIRANDO...';
            } else {
                shuffleBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                spinBtn.innerText = '🎰 GIRA LA RUOTA';
            }
        }

        // Aggiorna Sidebar Statistiche
        function updateStats() {
            remCount.innerText = `📊 Numeri Rimasti: ${numbers.length}`;
            elimCount.innerText = `❌ Numeri Eliminati: ${eliminatedNumbers.length}`;
            
            eliminatedContainer.innerHTML = '';
            // Mostra in ordine inverso per vedere l'ultimo eliminato in alto
            [...eliminatedNumbers].reverse().forEach(num => {
                const badge = document.createElement('span');
                badge.className = "bg-gradient-to-br from-red-600 to-red-900 text-white px-4 py-2 rounded-full text-lg font-bold shadow-xl border-2 border-red-400 transform hover:scale-105 transition-transform";
                badge.innerText = num;
                eliminatedContainer.appendChild(badge);
            });
        }

        // Funzione Grafica di Disegno della Ruota sul Canvas HTML5
        function drawWheel() {
            const canvas = wheelCanvas;
            if (!canvas || numbers.length === 0) return;
            
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 280;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const anglePerSegment = (Math.PI * 2) / numbers.length;
            
            // 1. Bordatura dorata esterna con ombra
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 30;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 25, 0, Math.PI * 2);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 12;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 20, 0, Math.PI * 2);
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 10;
            ctx.stroke();
            
            ctx.shadowBlur = 0; // Resetta ombra per i segmenti interni
            
            // 2. Disegno degli spicchi e dei testi
            numbers.forEach((num, index) => {
                const startAngle = index * anglePerSegment + (rotation * Math.PI / 180);
                const endAngle = startAngle + anglePerSegment;
                const isWinning = currentNumber === num;
                
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
                if (isWinning) {
                    gradient.addColorStop(0, '#FFFF00');
                    gradient.addColorStop(0.5, '#FFD700');
                    gradient.addColorStop(1, '#FFA500');
                } else if (index % 2 === 0) {
                    gradient.addColorStop(0, '#FF4444');
                    gradient.addColorStop(0.5, '#FF0000');
                    gradient.addColorStop(1, '#990000');
                } else {
                    gradient.addColorStop(0, '#444444');
                    gradient.addColorStop(0.5, '#222222');
                    gradient.addColorStop(1, '#000000');
                }
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.strokeStyle = isWinning ? '#FFFFFF' : '#FFD700';
                ctx.lineWidth = isWinning ? 8 : 4;
                ctx.stroke();
                
                // Testo dei numeri inserito negli spicchi
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + anglePerSegment / 2);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;
                
                ctx.font = isWinning ? 'bold 36px Arial' : 'bold 26px Arial';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 5;
                ctx.strokeText(num, radius * 0.7, 0);
                
                ctx.fillStyle = isWinning ? '#8B0000' : '#FFFFFF';
                ctx.fillText(num, radius * 0.7, 0);
                ctx.restore();
            });
            
            // 3. Logica del Cerchio Centrale
            if (currentNumber !== null) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, 100, 0, Math.PI * 2);
                const winCenterGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 100);
                winCenterGrad.addColorStop(0, '#FFFACD');
                winCenterGrad.addColorStop(0.5, '#FFD700');
                winCenterGrad.addColorStop(1, '#DAA520');
                ctx.fillStyle = winCenterGrad;
                ctx.fill();
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 12;
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(139, 0, 0, 0.8)';
                ctx.shadowBlur = 15;
                ctx.font = 'bold 90px Arial';
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 8;
                ctx.strokeText(currentNumber, 0, 0);
                ctx.fillStyle = '#FF0000';
                ctx.fillText(currentNumber, 0, 0);
                ctx.restore();
            } else {
                // Sfondo decorativo centrale standard
                const centerGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 100);
                centerGrad.addColorStop(0, '#FFD700');
                centerGrad.addColorStop(0.5, '#FFA500');
                centerGrad.addColorStop(1, '#FF6347');
                ctx.beginPath();
                ctx.arc(centerX, centerY, 100, 0, Math.PI * 2);
                ctx.fillStyle = centerGrad;
                ctx.fill();
                ctx.strokeStyle = '#8B4513';
                ctx.lineWidth = 8;
                ctx.stroke();
            }
            
            // 4. Piccole gemme intorno alla corona esterna
            for (let i = 0; i < 16; i++) {
                const angle = (i / 16) * Math.PI * 2;
                const x = centerX + Math.cos(angle) * (radius + 18);
                const y = centerY + Math.sin(angle) * (radius + 18);
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#FFD700';
                ctx.fill();
                ctx.strokeStyle = '#8B4513';
                ctx.stroke();
            }

            // 5. Freccia Direzionale Esterna (Bloccata a Destra)
            ctx.save();
            ctx.translate(centerX, centerY);
            const distanceFromWheel = radius + 30;
            
            // Corpo freccia
            ctx.beginPath();
            ctx.rect(distanceFromWheel + 25, -10, 45, 20);
            ctx.fillStyle = '#D3D3D3';
            ctx.fill();
            ctx.strokeStyle = '#555555';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Punta freccia
            ctx.beginPath();
            ctx.moveTo(distanceFromWheel, 0);
            ctx.lineTo(distanceFromWheel + 25, -20);
            ctx.lineTo(distanceFromWheel + 25, 20);
            ctx.closePath();
            ctx.fillStyle = '#FFD700';
            ctx.fill();
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Perno rosso finale della freccia
            ctx.beginPath();
            ctx.arc(distanceFromWheel + 70, 0, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#FF4500';
            ctx.fill();
            ctx.strokeStyle = '#FFD700';
            ctx.stroke();
            
            ctx.restore();
        }

        // Sistema Nativo dei Coriandoli (Confetti)
        let confettiPieces = [];
        const confettiColors = ['#FFD700', '#FF0000', '#00FF00', '#0000FF', '#FF00FF', '#FFA500', '#00FFFF'];

        function initConfetti() {
            confettiPieces = [];
            for (let i = 0; i < 150; i++) {
                confettiPieces.push({
                    x: Math.random() * confettiCanvas.width,
                    y: -20,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 15 + 5,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 3 + 2,
                    color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                    rotation: Math.random() * Math.PI * 2,
                    rotationSpeed: (Math.random() - 0.5) * 0.2
                });
            }
        }

        function loopConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let active = false;
            
            confettiPieces.forEach(p => {
                if (p.y < confettiCanvas.height + 20) active = true;
                
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rotation);
                confettiCtx.fillStyle = p.color;
                confettiCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                confettiCtx.restore();
                
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotationSpeed;
                p.vy += 0.05; // Forza di gravità
            });
            
            if (active || gameOver) {
                // Riparte se il gioco è finito (vittoria continua) o se ci sono pezzi in volo
                if (gameOver && confettiPieces.filter(p => p.y < 0 || p.y > confettiCanvas.height).length > 50) {
                    // Rigenera pezzi se finiscono durante la schermata di vittoria definitiva
                    confettiPieces.forEach(p => { if(p.y > confettiCanvas.height) p.y = -20; });
                }
                confettiAnimationId = requestAnimationFrame(loopConfetti);
            }
        }

        function startConfetti() {
            stopConfetti();
            initConfetti();
            loopConfetti();
        }

        function stopConfetti() {
            if (confettiAnimationId) {
                cancelAnimationFrame(confettiAnimationId);
            }
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        }
    </script>
</body>
</html>
